packages:
  - 'packages/*'

# Scripts de postinstall necesarios (sharp para next/image, esbuild para tooling)
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

# Fuerza nanoid 3.x en todo el árbol de dependencias (postcss@8.4.31 requiere nanoid/non-secure)
overrides:
  nanoid: '3.3.12'
